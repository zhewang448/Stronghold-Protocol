name: 功能请求
description: 提出一项新的功能。
title: "[Feature]:"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您贡献您的想法。
        请使用简洁明确的标题描述您希望增加或改进的功能。便于开发者了解您的想法。
        
        > [!important]
        > 重要：如果您想要提出 **多项功能**，请为每一个功能开一个单独的 issue。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 在开始反馈这个问题之前，请先检查：
      options:
        - label: 我已更新到本仓库 `main` 分支的 [最新提交](https://github.com/zhewang448/Stronghold-Protocol/commits/main/)，确认我想要的功能还没有实现，并已在 [Issues](https://github.com/zhewang448/Stronghold-Protocol/issues?q=-label%3Abug) 中检索，确认未被提交过。
          required: true
  - type: markdown
    attributes:
      value: |
        > [!note]
        > 上传附件时**请优先使用 GitHub 的附件系统上传附件**，将需要上传的附件粘贴或拖动到撰写区域即可上传。多个文件可打包为 zip 格式后上传。
  - type: textarea
    id: requested-feature
    attributes:
      label: 想要实现或优化的功能
      description: 详细地描述一下你想要的功能，联系到哪些已经存在的 BUG 或者功能(如有)，描述的越具体，采纳的可能性越高。
    validations:
      required: true
  - type: textarea
    id: expected-effect
    attributes:
      label: 期望效果
      placeholder: |
        请详细描述这个功能实现的效果。
    validations:
      required: true
  - type: checkboxes
    id: revision
    attributes:
      label: 最后一步
      description: 回顾您的回答
      options:
        - label: 我认为上述的描述已经足以详细，以便开发人员理解您想要的功能。如果我的 issue 没有按照上述的要求填写，可能会被无条件关闭。
          required: true

<!doctype html>
<!-- i18n-ignore-file: Chinese host console, same boundary as admin.html. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>登录 · 主机控制台</title>
<style>
  :root { color-scheme: dark; --bg: #0c0f0e; --panel: #141816; --line: #2f3a35; --mint: #4ed8af; --text: #dfe6e2; --dim: #a0afa7; --red: #ff9589; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  main { width: min(100% - 32px, 480px); margin: clamp(24px, 12vh, 112px) auto 32px; padding: clamp(20px, 5vw, 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 16px; color: var(--mint); }
  p { margin: 12px 0; }
  label { display: block; margin: 16px 0 8px; }
  input, button { font: inherit; border: 1px solid var(--line); border-radius: 4px; min-height: 44px; }
  input { width: 100%; background: var(--bg); color: var(--text); padding: 8px 10px; caret-color: var(--mint); }
  button { cursor: pointer; background: #20312a; color: var(--text); padding: 8px 14px; }
  button:hover { border-color: var(--mint); }
  button:disabled { cursor: wait; opacity: .6; }
  .primary { color: #0c0f0e; background: var(--mint); font-weight: 600; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .meta { color: var(--dim); font-size: 14px; }
  #status { min-height: 1.6em; color: var(--red); overflow-wrap: anywhere; }
  details { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 20px; }
  summary { cursor: pointer; min-height: 44px; padding-block: 8px; }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
  ::selection { color: var(--bg); background: var(--mint); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main aria-labelledby="title">
  <h1 id="title">主机控制台登录</h1>
  <p class="meta" id="context">正在读取访问状态…</p>
  <form id="login-form">
    <label for="password">管理密码</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256" aria-describedby="context" disabled>
    <div class="actions"><button class="primary" type="submit" disabled>登录控制台</button><button type="button" id="skip" hidden>跳过密码</button></div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <details id="reset" hidden>
    <summary>设置／重置密码</summary>
    <p class="meta">当前为本机访问，可直接设置新密码，无需旧密码。修改后其他浏览器会话需要重新登录。</p>
    <form id="reset-form">
      <label for="new-password">新密码（8–128 个字符）</label><input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="256">
      <label for="confirm-password">再次输入新密码</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="256">
      <div class="actions"><button class="primary" type="submit">保存密码并进入</button></div>
    </form>
  </details>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
async function submit(action, body) {
  for (const button of document.querySelectorAll('button')) button.disabled = true;
  $('status').textContent = '正在处理…';
  try {
    const response = await fetch(`/api/auth/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Login': '1' }, body: JSON.stringify(body) });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '操作失败，请重试。');
    location.replace('/');
  } catch (error) { $('status').textContent = error.message; }
  finally { for (const button of document.querySelectorAll('button')) button.disabled = false; }
}
$('login-form').addEventListener('submit', (event) => { event.preventDefault(); submit('login', { password: $('password').value }); });
$('skip').addEventListener('click', () => submit('skip', {}));
$('reset-form').addEventListener('submit', (event) => {
  event.preventDefault(); submit('password', { newPassword: $('new-password').value, confirmPassword: $('confirm-password').value });
});
try {
  const response = await fetch('/api/auth/status');
  const state = await response.json();
  if (!response.ok) throw new Error('当前地址未允许访问控制台，请在主机上检查访问配置。');
  $('context').textContent = state.warning || (state.local ? '本机访问：可输入密码，也可跳过密码直接进入。' : '非本机访问：请输入主机设置的管理密码。');
  $('skip').hidden = $('reset').hidden = !state.local;
  $('password').disabled = !state.passwordSet;
  document.querySelector('#login-form button[type="submit"]').disabled = !state.passwordSet;
  if (!state.passwordSet) $('status').textContent = '尚未设置密码，请在本机设置密码或选择跳过。';
} catch (error) { $('status').textContent = error.message; }
</script>
</body>
</html>

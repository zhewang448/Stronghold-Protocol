<!doctype html>
<!-- i18n-ignore-file: Chinese host console, same boundary as admin.html. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>登录 · 主机控制台</title>
<style>

  :root { color-scheme: dark; --bg: #0c0f0e; --panel: #141816; --line: #2f3a35; --mint: #4ed8af; --text: #dfe6e2; --dim: #a0afa7; --red: #ff9589; }
  @font-face { font-family: 'Novecento Wide'; font-style: normal; font-weight: 400; font-display: swap; src: url('/login-display.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, 'Microsoft YaHei', sans-serif; }
  p { margin: 12px 0; }
  label { display: block; margin: 16px 0 8px; }
  input, button { font: inherit; }
  input { width: 100%; }
  button { border: 1px solid var(--line); }
  button:disabled { cursor: wait; opacity: .6; }
  .primary { background: var(--mint); color: #06110d; }
  .meta { color: var(--dim); }
  summary { cursor: pointer; }
  #status { overflow-wrap: anywhere; }
  [hidden] { display: none !important; }


.sp-login { --sp-mint: #4ed8af; --sp-gold: #f2bd3e; --sp-hi: #f2f2f2; --sp-lo: #a0afa7; width: min(1120px, calc(100% - 48px)); min-width: 0; margin: clamp(40px, 10vh, 110px) auto 96px; color: var(--text); border-radius: 0; padding: 0; isolation: isolate; overflow: visible; position: relative; }
.sp-login *, .sp-login *::before, .sp-login *::after { box-sizing: border-box; }
.sp-login h1 { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
.sp-login h2 { font-size: 25px; line-height: 1.35; margin: 0 0 14px; letter-spacing: .035em; font-weight: 650; color: var(--sp-hi); }
.sp-login .meta { color: var(--sp-lo); font-size: 14px; line-height: 1.8; }
.sp-login #context { margin: 0 0 32px; max-width: 34ch; font-size: 14px; }
.sp-login .identity { display: flex; align-items: center; gap: 10px; }
.sp-login .identity > svg { width: 36px; height: 36px; flex: none; }
.sp-login .identity span { font: 13px/1.25 'Novecento Wide', system-ui, sans-serif; letter-spacing: .12em; }
.sp-login .identity strong { display: block; font-size: 10px; font-weight: 400; margin-top: 5px; color: var(--sp-mint); letter-spacing: .25em; }
.sp-login .local-marker { font-size: 12px; color: var(--sp-mint); display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.sp-login .local-marker::before { content: ''; width: 5px; height: 5px; background: currentColor; }
.sp-login .access-form > label { font-size: 13px; letter-spacing: .05em; color: #c3cbc7; margin: 0 0 10px; }
.sp-login .password-slot { position: relative; }
.sp-login input { border: 1px solid #3e4b45; border-radius: 0; min-height: 52px; padding: 12px 48px 12px 14px; font-size: 15px; background: #0c0f0e; color: var(--sp-hi); transition: border-color 160ms ease-out, background-color 160ms ease-out; caret-color: var(--sp-mint); }
.sp-login input::placeholder { color: var(--sp-lo); }
.sp-login input:focus { outline: 1px solid var(--sp-mint); outline-offset: -1px; border-color: var(--sp-mint); background: #111d18; }
.sp-login .input-tail { position: absolute; right: 13px; top: 13px; color: #58675f; pointer-events: none; }
.sp-login .input-tail svg { width: 25px; height: 25px; }
.sp-login .actions { display: flex; align-items: stretch; gap: 12px; margin: 20px 0 0; }
.sp-login button { font-size: 14px; border-radius: 0; min-height: 50px; cursor: pointer; transition: background-color 150ms ease-out, border-color 150ms ease-out; }
.sp-login .primary { position: relative; flex: 1; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 15px; background: var(--sp-mint); border: 1px solid var(--sp-mint); color: #06110d; font-weight: 700; overflow: hidden; }
.sp-login .primary svg { width: 23px; height: 23px; flex: none; }
.sp-login .primary::after { content: ''; position: absolute; right: 46px; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(135deg, transparent 0 2px, #06110d1f 2px 3px); }
.sp-login .primary:hover { background: #59f4ca; border-color: #59f4ca; }
.sp-login .skip-action { background: transparent; color: var(--sp-hi); padding: 10px 16px; border-color: #3e4b45; }
.sp-login .skip-action:hover { background: #1e2421; border-color: var(--sp-mint); }
.sp-login button:active { transform: translateY(1px); }
.sp-login :focus-visible { outline: 2px solid var(--sp-mint); outline-offset: 4px; }
.sp-login .feedback { color: #ff9589; margin: 8px 0; min-height: 12px; font-size: 13px; }
.sp-login .reset-access { margin-top: 10px; padding: 14px 0 0; border-top: 1px solid var(--line); }
.sp-login summary { display: flex; align-items: center; justify-content: space-between; color: #c3cbc7; font-size: 13px; padding: 8px 0; min-height: 42px; list-style: none; }
.sp-login summary::-webkit-details-marker { display: none; }
.sp-login summary svg { width: 14px; height: 14px; }
.sp-login details[open] summary svg { transform: rotate(90deg); }
.sp-login details label { font-size: 13px; }
.sp-login .stage-footer { display: flex; justify-content: space-between; gap: 16px; font: 11px/1.5 'Novecento Wide', sans-serif; letter-spacing: .12em; color: var(--sp-lo); }
.sp-login ::selection { background: var(--sp-mint); color: #06110d; }
.sp-login { scrollbar-color: #58675f #141816; }
@media (max-width: 760px) {
.sp-login { width: calc(100% - 28px); margin: 20px auto 110px; }
.sp-login h2 { font-size: 22px; }
.sp-login #context { margin-bottom: 24px; }
.sp-login .actions { gap: 8px; }
.sp-login .stage-footer { font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) { .sp-login * { animation: none !important; transition: none !important; } }

.sp-terminal { width: min(1000px, calc(100% - 48px)); background: #141816; border: 1px solid #58675f; box-shadow: 0 24px 64px #0005; }
.sp-terminal .terminal-mast { background: #c3cbc7; color: #0c0f0e; display: grid; grid-template-columns: 1fr 200px; align-items: center; gap: 20px; padding: 26px 38px; position: relative; overflow: hidden; }
.sp-terminal .terminal-mast::after { content: ''; position: absolute; width: 150px; height: 200px; right: 125px; top: -60px; transform: rotate(30deg); background: repeating-linear-gradient(90deg, transparent 0 5px, #0c0f0e15 5px 6px); }
.sp-terminal .terminal-mast h1 { color: #0c0f0e; font-size: 53px; font-weight: 900; letter-spacing: .055em; line-height: 1.15; margin: 0; }
.sp-terminal .terminal-mast h1 span { display: block; font-size: 17px; font-weight: 600; letter-spacing: .45em; margin-top: 12px; }
.sp-terminal .terminal-mast .identity { color: #0c0f0e; z-index: 1; }
.sp-terminal .terminal-mast .identity strong { color: #145443; }
.sp-terminal .terminal-mast .identity svg { width: 54px; height: 54px; }
.sp-terminal .terminal-body { display: grid; grid-template-columns: 220px 1fr; }
.sp-terminal .terminal-rail { padding: 34px 28px; background: #0f1512; border-right: 1px solid #3e4b45; display: flex; flex-direction: column; align-items: flex-start; }
.sp-terminal .terminal-rail .identity { display: block; color: var(--sp-mint); }
.sp-terminal .terminal-rail .identity svg { width: 115px; height: 115px; display: block; margin: 30px 0 24px; }
.sp-terminal .rail-bars { display: flex; gap: 5px; margin-top: 32px; }
.sp-terminal .rail-bars i { width: 17px; height: 6px; background: var(--sp-mint); opacity: .6; }
.sp-terminal .rail-bars i:last-child { background: var(--sp-gold); }
.sp-terminal .rail-caption { font-size: 12px; color: #a0afa7; line-height: 1.8; margin-top: 18px; }
.sp-terminal .terminal-access { padding: 36px 50px; }
.sp-terminal .terminal-access h2 { font-size: 27px; }
.sp-terminal .terminal-access #context { max-width: none; margin-bottom: 28px; }
.sp-terminal .terminal-access .primary { background: var(--sp-mint); }
.sp-terminal .stage-footer { border-top: 1px solid #3e4b45; padding: 15px 28px; }
@media (max-width: 760px) {
.sp-terminal .terminal-mast { padding: 25px 22px; grid-template-columns: 1fr 58px; gap: 10px; }
.sp-terminal .terminal-mast h1 { font-size: 38px; }
.sp-terminal .terminal-mast h1 span { font-size: 13px; letter-spacing: .3em; }
.sp-terminal .terminal-mast .identity span { display: none; }
.sp-terminal .terminal-mast .identity svg { width: 48px; height: 48px; }
.sp-terminal .terminal-body { grid-template-columns: 1fr; }
.sp-terminal .terminal-rail { flex-direction: row; justify-content: space-between; align-items: center; padding: 17px 22px; border-right: 0; border-bottom: 1px solid #3e4b45; }
.sp-terminal .terminal-rail .identity, .sp-terminal .terminal-rail .rail-caption { display: none; }
.sp-terminal .rail-bars { margin: 0; }
.sp-terminal .terminal-access { padding: 28px 22px; }
.sp-terminal .stage-footer { padding: 14px 22px; }
}


  .sp-terminal .terminal-mast h1 { position: relative; z-index: 1; }
  .sp-terminal .terminal-mast h1 span { line-height: 1.5; }
  .sp-login .password-slot input { padding-right: 48px; }
  .sp-login .reset-access input { padding-right: 14px; }
  .sp-login button:disabled:hover { background: var(--sp-mint); border-color: var(--sp-mint); }
  .sp-login button:disabled { cursor: not-allowed; }
  .sp-login [aria-busy='true'] button { cursor: wait; }
  .sp-login #status:empty { min-height: 12px; }
  .sp-terminal .terminal-access { animation: terminal-arrive 220ms cubic-bezier(.16, 1, .3, 1); }
  @keyframes terminal-arrive { from { clip-path: inset(0 0 10px); opacity: .85; } to { clip-path: inset(0); opacity: 1; } }
  @media (max-width: 760px) { .sp-terminal { width: calc(100% - 28px); } }
  @media (max-width: 359px) { .sp-terminal .terminal-mast h1 { font-size: 32px; } .sp-terminal .terminal-access { padding-inline: 16px; } }

</style>
</head>
<body>
<main id="login-panel" class="sp-login sp-terminal" aria-labelledby="title">
    <header class="terminal-mast"><h1>卫戍协议<span>盟约</span></h1><div class="identity" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h4v2H5v20h2v2H3zM29 4h-4v2h2v20h-2v2h4zM10 8h3v2h2V8h2v2h2V8h3v5l-2 2v6l2 2v2H10v-2l2-2v-6l-2-2z" fill="currentColor"/></svg><span>STRONGHOLD<br>PROTOCOL<strong>ALLIANCE</strong></span></div></header>
    <div class="terminal-body"><aside class="terminal-rail" aria-label="访问状态"><span class="local-marker" id="access-mode" role="status">正在连接</span><div class="identity" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h4v2H5v20h2v2H3zM29 4h-4v2h2v20h-2v2h4zM10 8h3v2h2V8h2v2h2V8h3v5l-2 2v6l2 2v2H10v-2l2-2v-6l-2-2z" fill="currentColor"/></svg><span>STRONGHOLD<br>PROTOCOL<strong>ALLIANCE</strong></span></div><div class="rail-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="rail-caption">主机控制台<br>STRONGHOLD PROTOCOL</p></aside>
    <section class="terminal-access"><h2 id="title">主机控制台登录</h2><p class="meta" id="context">正在读取访问状态…</p><form id="login-form" class="access-form">
        <label for="password">管理密码</label>
        <div class="password-slot"><input id="password" disabled type="password" autocomplete="current-password" required minlength="8" maxlength="256" aria-describedby="context" placeholder="输入管理密码"><span aria-hidden="true" class="input-tail"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h4v2H5v20h2v2H3zM29 4h-4v2h2v20h-2v2h4zM10 8h3v2h2V8h2v2h2V8h3v5l-2 2v6l2 2v2H10v-2l2-2v-6l-2-2z" fill="currentColor"/></svg></span></div>
        <div class="actions"><button class="primary" type="submit" disabled><span>登录控制台</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button><button class="skip-action" type="button" id="skip" hidden>跳过密码</button></div>
      </form>
      <p id="status" class="feedback" role="status" aria-live="polite"></p>
      <details id="reset" hidden class="reset-access"><summary><span>设置／重置密码</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></summary>
        <p class="meta">当前为本机访问，可直接设置新密码，无需旧密码。修改后其他浏览器会话需要重新登录。</p>
        <form id="reset-form"><label for="new-password">新密码（8–128 个字符）</label><input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="256"><label for="confirm-password">再次输入新密码</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="256"><div class="actions"><button class="primary" type="submit">保存密码并进入</button></div></form>
      </details></section></div><footer class="stage-footer"><span>STRONGHOLD PROTOCOL</span><span>HOST CONSOLE</span></footer></main>
<script type="module">
const $ = (id) => document.getElementById(id);
async function submit(action, body) {
  for (const button of document.querySelectorAll('button')) button.disabled = true;
  $('status').textContent = '正在处理…';
  try {
    const response = await fetch(`/api/auth/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Login': '1' }, body: JSON.stringify(body) });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '操作失败，请重试。');
    location.replace('/');
  } catch (error) { $('status').textContent = error.message; }
  finally { for (const button of document.querySelectorAll('button')) button.disabled = false; }
}
$('login-form').addEventListener('submit', (event) => { event.preventDefault(); submit('login', { password: $('password').value }); });
$('skip').addEventListener('click', () => submit('skip', {}));
$('reset-form').addEventListener('submit', (event) => {
  event.preventDefault(); submit('password', { newPassword: $('new-password').value, confirmPassword: $('confirm-password').value });
});
try {
  const response = await fetch('/api/auth/status');
  const state = await response.json();
  if (!response.ok) throw new Error('当前地址未允许访问控制台，请在主机上检查访问配置。');
  $('access-mode').textContent = state.local ? '本机访问' : '非本机访问';
  $('context').textContent = state.warning || (state.local ? '本机访问：可输入密码，也可跳过密码直接进入。' : '非本机访问：请输入主机设置的管理密码。');
  $('skip').hidden = $('reset').hidden = !state.local;
  $('password').disabled = !state.passwordSet;
  document.querySelector('#login-form button[type="submit"]').disabled = !state.passwordSet;
  if (!state.passwordSet) $('status').textContent = '尚未设置密码，请在本机设置密码或选择跳过。';
} catch (error) { $('access-mode').textContent = '连接失败'; $('status').textContent = error.message; }
</script>
</body>
</html>
